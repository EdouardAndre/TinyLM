dataset:
  train_path: ../archive/train.csv
  validation_path: ../archive/validation.csv
  text_column: text
  tokenizer: bpe
  vocab_size: 128
  min_pair_frequency: 2
  context_length: 32
  batch_size: 4
  max_train_chars: 5000
  max_validation_chars: 1000

model:
  vocab_size: null
  d_model: 32
  n_layers: 1
  n_heads: 4
  context_length: 32

training:
  seed: 1337
  learning_rate: 0.001
  weight_decay: 0.01
  max_steps: 10
  eval_interval: 5
  grad_clip: 1.0
  checkpoint_dir: null
  checkpoint_interval: null
  device: null
